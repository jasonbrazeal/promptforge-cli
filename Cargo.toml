[package]
name = "promptforge-cli"
version = "0.1.0"
edition = "2024"
# The floor the dependency tree imposes (redb, konst); verified in CI.
rust-version = "1.89"
license = "BSL-1.0"
description = "Run PromptForge prompts from the command line"
readme = "README.md"
keywords = ["promptforge", "prompt", "llm", "cli"]
categories = ["command-line-utilities"]
publish = false

[[bin]]
name = "promptforge"
path = "src/main.rs"

[dependencies]
# The PromptForge engine, consumed through its one public door; the host
# vocabulary (`promptforge-api-types`) rides along as its `types` re-export.
# Not on crates.io; Cargo.lock pins the revision and
# `cargo update -p promptforge-api-runtime` moves it forward.
promptforge-api-runtime = { git = "https://github.com/cppalliance/promptforge", branch = "master" }
shared-vfs = { git = "https://github.com/cppalliance/promptforge", branch = "master" }

anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
fastrand = "2"
tokio = { version = "1", features = ["macros", "rt", "signal", "fs", "io-std", "io-util"] }

# Why this patch exists
#
# Every crate in the promptforge workspace depends on `workspace-hack`, a
# crate generated by cargo-hakari. Its only job is build-speed inside that
# workspace: it lists the union of every third-party dependency and feature
# the workspace's products (PromptForge, Gateway, Workshop) use, so that
# `cargo build -p <one crate>` and `cargo build --workspace` resolve the same
# feature sets and share compiled artifacts. It contains no code and exports
# nothing; the engine never calls into it.
#
# That trick only pays off inside the workspace. Consumed from here as a git
# dependency, `workspace-hack` is just another crate with ~190 dependencies
# of its own, so it drags the Workshop desktop stack (Tauri, GTK, muda, x11,
# zbus, libxdo) and the Gateway's local-inference stack (candle, ...) into a
# command-line tool that uses none of them - and a Linux build would then
# need GTK development headers before `cargo build` even starts.
#
# What the patch does
#
# `[patch."<git url>"]` tells Cargo: whenever a crate resolved from that git
# source asks for `workspace-hack`, use this local path instead. The stub in
# `workspace-hack/` is an empty library with the same name and version the
# engine's manifests request (`workspace-hack = "0.1"`), so the resolver
# accepts the swap and the real crate, with its dependency tree, never enters
# the graph. Nothing else changes: the engine's own dependencies still come
# from the pinned git revision, and feature unification for them is done by
# Cargo the ordinary way. This is the remedy cargo-hakari documents for
# downstream git and path consumers:
# https://docs.rs/cargo-hakari/latest/cargo_hakari/patch_directive/index.html
#
# When it needs attention
#
# - If upstream renames the crate or bumps its version, the patch stops
#   matching and Cargo warns "patch ... was not used in the crate graph";
#   update the stub's name/version to match.
# - If upstream publishes a stub `workspace-hack` to crates.io and switches
#   to `[patch.crates-io]` internally (hakari's recommended setup), this
#   block and the `workspace-hack/` directory can be deleted.
[patch."https://github.com/cppalliance/promptforge"]
workspace-hack = { path = "workspace-hack" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"
future_incompatible = { level = "warn", priority = -1 }

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "warn"
# Flags product names (PromptForge, OpenAI) in prose; backticking them
# reads worse than the lint is worth.
doc_markdown = "allow"
