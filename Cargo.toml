[package]
name = "promptforge-cli"
version = "0.1.0"
edition = "2024"
# The floor the dependency tree imposes (redb, konst); verified in CI.
rust-version = "1.89"
license = "BSL-1.0"
description = "Run PromptForge prompts from the command line"
readme = "README.md"
keywords = ["promptforge", "prompt", "llm", "cli"]
categories = ["command-line-utilities"]
publish = false

[[bin]]
name = "promptforge"
path = "src/main.rs"

[dependencies]
# The PromptForge engine, consumed through its one public door plus the
# shared host vocabulary. Not on crates.io; Cargo.lock pins the revision and
# `cargo update -p promptforge-api` moves it forward.
promptforge-api = { git = "https://github.com/cppalliance/promptforge", branch = "master" }
shared-promptforge-api = { git = "https://github.com/cppalliance/promptforge", branch = "master" }
shared-vfs = { git = "https://github.com/cppalliance/promptforge", branch = "master" }

anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
fastrand = "2"
tokio = { version = "1", features = ["macros", "rt", "signal", "fs", "io-std", "io-util"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"
future_incompatible = { level = "warn", priority = -1 }

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "warn"
# Flags product names (PromptForge, OpenAI) in prose; backticking them
# reads worse than the lint is worth.
doc_markdown = "allow"
